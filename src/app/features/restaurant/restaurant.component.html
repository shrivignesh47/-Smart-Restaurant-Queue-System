<div class="restaurant-page">
    <!-- Header/Hero -->
    <div class="restaurant-hero" [style.backgroundImage]="'url(' + restaurant.image + ')'">
        <div class="overlay"></div>
        <div class="container hero-content" style="display: flex; align-items: flex-end; gap: 24px;">
            <div class="logo-wrapper" *ngIf="restaurant.logo"
                style="width: 120px; height: 120px; background: white; border-radius: 12px; padding: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-bottom: 4px;">
                <img [src]="restaurant.logo" style="max-width: 100%; max-height: 100%; object-fit: contain;">
            </div>
            <div class="text-content">
                <span class="status-badge" [class.open]="restaurant.status === 'Open'">{{ restaurant.status }}</span>
                <h1>{{ restaurant.name }}</h1>
                <p class="cuisine">{{ restaurant.cuisine }} • <mat-icon class="star">star</mat-icon> {{
                    restaurant.rating }}
                </p>
                <p class="address"><mat-icon>location_on</mat-icon> {{ restaurant.address }}</p>
            </div>
        </div>
    </div>

    <div class="container content-wrapper">
        <!-- Sidebar Info -->
        <aside class="sidebar">
            <mat-card class="info-card">
                <mat-card-content>
                    <h3>Information</h3>
                    <div class="info-item">
                        <mat-icon>schedule</mat-icon>
                        <div>
                            <strong>Hours</strong>
                            <p>{{ restaurant.hours }}</p>
                        </div>
                    </div>
                    <div class="info-item">
                        <mat-icon>description</mat-icon>
                        <div>
                            <strong>About</strong>
                            <p>{{ restaurant.description }}</p>
                        </div>
                    </div>

                    <div class="tags">
                        <span class="tag" *ngFor="let tag of restaurant.tags">{{ tag }}</span>
                    </div>
                </mat-card-content>
            </mat-card>
        </aside>

        <!-- Main Content Area -->
        <main class="main-area">
            <nav mat-tab-nav-bar [tabPanel]="tabPanel" [style.backgroundColor]="restaurant.themeColor">
                <a mat-tab-link *ngFor="let link of visibleNavLinks" [routerLink]="link.path" routerLinkActive
                    #rla="routerLinkActive" [active]="rla.isActive">
                    <mat-icon class="mr-2">{{ link.icon }}</mat-icon> {{ link.label }}
                </a>
            </nav>

            <div class="tab-content">
                <mat-tab-nav-panel #tabPanel>
                    <router-outlet></router-outlet>
                </mat-tab-nav-panel>
            </div>
        </main>
    </div>
</div>
