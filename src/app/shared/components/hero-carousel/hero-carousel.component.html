<div class="carousel-container">
    <div class="carousel-slide" *ngFor="let slide of slides; let i = index" [class.active]="i === currentSlide">
        <!-- Text Content -->
        <div class="slide-content">
            <div class="badge">
                <mat-icon>{{ slide.icon }}</mat-icon> {{ slide.badge }}
            </div>
            <h1>
                <span class="d-block">{{ slide.title1 }}</span>
                <span class="text-serif text-gold">{{ slide.title2 }}</span>
            </h1>
            <p>{{ slide.desc }}</p>
            <div class="actions">
                <button mat-flat-button color="accent" class="btn-gold">
                    {{ slide.ctaPrimary }} <mat-icon>arrow_forward</mat-icon>
                </button>
                <button mat-stroked-button class="btn-outline">
                    {{ slide.ctaSecondary }}
                </button>
            </div>
        </div>

        <!-- Image/Visual -->
        <div class="slide-visual">
            <div class="image-wrapper">
                <img [src]="slide.image" alt="Visual">
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="carousel-controls">
        <button mat-icon-button (click)="prevSlide()">
            <mat-icon>chevron_left</mat-icon>
        </button>

        <div class="dots">
            <span *ngFor="let s of slides; let i = index" [class.active]="i === currentSlide"
                (click)="currentSlide = i"></span>
        </div>

        <button mat-icon-button (click)="nextSlide()">
            <mat-icon>chevron_right</mat-icon>
        </button>
    </div>
</div>
